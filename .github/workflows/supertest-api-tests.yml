name: Supertest API Tests Demo
on: [pull_request, push]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Create .env file
        run: |
          touch .env
          echo "ACCESS_TOKEN=${{ secrets.ACCESS_TOKEN }}" >> .env

      - name: Install Dependencies
        run: npm ci

      - name: Run Supertest Suites
        run: npm test

      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: supertest-report
          path: mochawesome-report/mochawesome.html
          if-no-files-found: error
